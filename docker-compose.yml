services:
  flv2mp4:
    build: .
    image: ikimi/flv2mp4-web:latest
    container_name: flv2mp4-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 访问密码，留空则无需登录（公网部署务必设置）
      # V2M_PASSWORD: 你的访问密码
      # 不设置 V2M_ROOTS 时自动探测：/host -> /data -> 容器根目录
      # V2M_ROOTS: /host
      # V2M_DEFAULT_INPUT: /host/home
    volumes:
      # 整机挂载：界面里的路径 = /host + 宿主机路径，例如 /host/home/录播归档
      - /:/host
      # 只挂载指定目录时改用下面这行，并设置 V2M_ROOTS: /home
      # - /home:/home
      # 设置与会话持久化
      - ./config:/config
