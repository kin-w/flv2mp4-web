services:
  flv2mp4:
    build: .
    image: ikimi/flv2mp4-web:latest
    container_name: flv2mp4-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 访问密码，留空则不启用登录
      V2M_PASSWORD: 改成你的密码
      # 宿主机根目录已挂载到 /host，允许整个 /host 即可访问全盘
      V2M_ROOTS: /host
      # 默认输入目录（“恢复默认”时使用）
      V2M_DEFAULT_INPUT: /host
    volumes:
      # 宿主机根目录 -> 容器内 /host
      # 界面里填写容器路径，例如宿主机 /home/录播归档 对应 /host/home/录播归档
      # 注意：这等于把整台机器交给 Web 界面（可读取、可删除），请务必设置密码并限制来源 IP
      - /:/host
      # 界面设置持久化（输入/输出目录、开关状态、登录会话）
      - ./config:/config
