<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>视频转 MP4</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<script>
  (function () {
    try {
      var t = localStorage.getItem("v2m-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="/static/logo.svg" alt="" width="26" height="26">
      <h1>视频<span class="sep">→</span>MP4</h1>
      <span class="tag">批量无损转封装</span>
    </div>
    <div class="topbar-right">
      <div class="status" id="status"><i></i><span>就绪</span></div>
      <button class="icon-btn theme-btn" id="btnTheme" title="切换明亮 / 深色主题" aria-label="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button class="link" id="logoutBtn" hidden>退出</button>
    </div>
  </header>

  <main class="grid">
    <section class="card settings">
      <div class="card-head">
        <h2>设置</h2>
        <button class="link" id="btnReset">恢复默认</button>
      </div>

      <div class="field">
        <label>输入目录 / 文件</label>
        <div class="input-row">
          <input id="inputPath" type="text" spellcheck="false" autocomplete="off">
          <button class="btn" id="btnBrowseInput">浏览</button>
        </div>
      </div>

      <div class="field">
        <label>输出目录 <em>留空 = 与输入相同</em></label>
        <div class="input-row">
          <input id="outputPath" type="text" spellcheck="false" autocomplete="off" placeholder="留空则输出到输入目录">
          <button class="btn" id="btnBrowseOutput">浏览</button>
          <button class="btn ghost" id="btnClearOutput">清空</button>
        </div>
      </div>

      <div class="field">
        <label>识别格式 <em>逗号分隔，统一输出 MP4</em></label>
        <div class="input-row">
          <input id="extensions" type="text" spellcheck="false" autocomplete="off" placeholder="flv,ts,mkv,avi,mov,wmv">
          <button class="btn ghost" id="btnResetExt">默认</button>
        </div>
        <p class="hint">想支持其他后缀，直接加进去即可（如 rmvb、m2ts）</p>
      </div>

      <details class="adv">
        <summary>转换命令<em>高级设置</em></summary>
        <textarea id="command" rows="3" spellcheck="false"></textarea>
        <div class="cmd-foot">
          <span class="hint">{input} 为源文件，{output} 为输出文件；不经 shell</span>
          <button class="btn ghost sm" id="btnResetCmd">默认</button>
        </div>
      </details>

      <div class="switches">
        <label class="switch">
          <input type="checkbox" id="deleteSource">
          <span class="track"><span class="thumb"></span></span>
          <span class="txt">转换成功后删除源文件<em>默认开启</em></span>
        </label>
        <label class="switch">
          <input type="checkbox" id="moveToOutput">
          <span class="track"><span class="thumb"></span></span>
          <span class="txt">转换成功后移动到输出目录<em>关闭则直接写入输出目录</em></span>
        </label>
        <label class="switch">
          <input type="checkbox" id="recursive">
          <span class="track"><span class="thumb"></span></span>
          <span class="txt">递归扫描子目录</span>
        </label>
      </div>

      <div class="warn hidden" id="risk">
        <strong>风险提示</strong>
        <p>已关闭“转换成功后移动到输出目录”，转换结果会直接写入输出目录。若转换中断，输出目录将残留不完整文件；跨磁盘时也无法保证原子写入。</p>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnSave">保存设置</button>
        <span class="save-hint" id="saveHint"></span>
      </div>
    </section>

    <div class="right">
      <section class="card files">
        <div class="card-head">
          <h2>待转换文件</h2>
          <button class="btn ghost sm" id="btnScan">重新扫描</button>
        </div>
        <div class="list-toolbar">
          <label class="check"><input type="checkbox" id="checkAll"><span>全选</span></label>
          <span class="count" id="fileCount">—</span>
          <button class="btn primary sm" id="btnConvertSelected" disabled>转换所选</button>
        </div>
        <div class="list" id="fileList">
          <div class="empty">正在加载…</div>
        </div>
      </section>

      <section class="card jobs">
        <div class="card-head">
          <h2>转换任务</h2>
          <div class="head-actions">
            <button class="link" id="btnJobScope">显示全部</button>
            <button class="link" id="btnClearJobs">清空已完成</button>
          </div>
        </div>
        <div class="list" id="jobList">
          <div class="empty">暂无任务</div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="modal hidden" id="browseModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="browseTitle">选择目录</h3>
      <button class="icon-btn" id="browseClose">✕</button>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="browser" id="browser"></div>
    <div class="modal-foot">
      <span class="hint">可选中视频文件，或直接使用当前目录</span>
      <div class="foot-actions">
        <button class="btn ghost" id="browseCancel">取消</button>
        <button class="btn primary" id="browsePickDir">使用当前目录</button>
      </div>
    </div>
  </div>
</div>

<div class="modal hidden" id="confirmModal">
  <div class="modal-box small">
    <div class="modal-head"><h3 id="confirmTitle">确认</h3></div>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-foot">
      <div class="foot-actions">
        <button class="btn ghost" id="confirmNo">取消</button>
        <button class="btn danger" id="confirmYes">继续</button>
      </div>
    </div>
  </div>
</div>

<div class="modal hidden" id="logModal">
  <div class="modal-box log-box">
    <div class="modal-head">
      <h3 id="logTitle">转换日志</h3>
      <div class="log-head-actions">
        <span class="chip run" id="logState">实时</span>
        <button class="icon-btn" id="logClose">✕</button>
      </div>
    </div>
    <pre class="log-view" id="logView"></pre>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
