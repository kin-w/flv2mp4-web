<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>登录 · 视频转 MP4</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<script>
  (function () {
    try {
      var t = localStorage.getItem("v2m-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
<style>
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0c11;
    --bg-glow: radial-gradient(1100px 620px at 50% -14%, #1a2136 0%, rgba(10, 12, 17, 0) 66%);
    --panel: rgba(20, 23, 32, .82);
    --panel-2: #0d1016;
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .13);
    --text: #e9edf5;
    --text-2: #c2c9d6;
    --muted: #7d8798;
    --accent: #6d8cff;
    --accent-2: #9b7bff;
    --accent-soft: rgba(109, 140, 255, .14);
    --danger: #ff8f8f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f5fa;
    --bg-glow: radial-gradient(1100px 620px at 50% -16%, #dfe6ff 0%, rgba(243, 245, 250, 0) 62%);
    --panel: rgba(255, 255, 255, .9);
    --panel-2: #f5f7fc;
    --line: rgba(19, 28, 54, .08);
    --line-2: rgba(19, 28, 54, .14);
    --text: #141a28;
    --text-2: #39425a;
    --muted: #6b7488;
    --accent: #4f6ef7;
    --accent-2: #8b5cf6;
    --accent-soft: rgba(79, 110, 247, .1);
    --danger: #d94a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
    background-image: var(--bg-glow);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s, color .25s;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 368px;
    padding: 30px 26px 24px;
    border: 1px solid var(--line-2);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: 0 28px 70px rgba(0, 0, 0, .28);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .theme-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: 9px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--accent); }
  .theme-btn svg { width: 16px; height: 16px; }
  .theme-btn .icon-sun { display: none; }
  :root[data-theme="light"] .theme-btn .icon-sun { display: block; }
  :root[data-theme="light"] .theme-btn .icon-moon { display: none; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand img { width: 40px; height: 40px; border-radius: 11px; }
  .brand b { display: block; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
  .brand span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }

  label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  input[type=password] {
    width: 100%;
    padding: 11px 13px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .row { display: flex; align-items: center; gap: 8px; margin: 14px 0 20px; font-size: 12.5px; color: var(--text-2); }
  .row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
  .row label { margin: 0; font-size: 12.5px; color: var(--text-2); cursor: pointer; }

  .submit {
    width: 100%;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(109, 140, 255, .26);
    transition: opacity .15s, transform .12s;
  }
  .submit:hover { opacity: .94; }
  .submit:active { transform: translateY(1px); }
  .submit:disabled { opacity: .55; cursor: default; }

  .err { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--danger); }
  .tips { margin-top: 16px; font-size: 11.5px; line-height: 1.7; color: var(--muted); }
</style>
</head>
<body>
<form class="card" id="loginForm" autocomplete="on">
  <button type="button" class="theme-btn" id="themeBtn" title="切换明亮 / 深色主题" aria-label="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
  <div class="brand">
    <img src="/static/logo.svg" alt="">
    <div>
      <b>视频转 MP4</b>
      <span>批量无损转封装</span>
    </div>
  </div>
  <label for="pwd">访问密码</label>
  <input id="pwd" type="password" name="password" autocomplete="current-password" autofocus required>
  <div class="row">
    <input id="remember" type="checkbox" checked>
    <label for="remember">记住登录状态（30 天）</label>
  </div>
  <button class="submit" id="submitBtn" type="submit">登录</button>
  <div class="err" id="err"></div>
  <div class="tips">密码由部署时设置的环境变量 V2M_PASSWORD 决定，无法在界面中修改。</div>
</form>
<script>
(function () {
  var form = document.getElementById("loginForm");
  var pwd = document.getElementById("pwd");
  var remember = document.getElementById("remember");
  var err = document.getElementById("err");
  var btn = document.getElementById("submitBtn");

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = theme === "light" ? "#f3f5fa" : "#0a0c11";
    try { localStorage.setItem("v2m-theme", theme); } catch (e) {}
  }

  document.getElementById("themeBtn").addEventListener("click", function () {
    applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
  });

  fetch("/api/auth").then(function (r) { return r.json(); }).then(function (d) {
    if (!d.required) location.replace("/");
  }).catch(function () {});

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ password: pwd.value, remember: remember.checked })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (res.ok) {
        location.replace("/");
      } else {
        err.textContent = res.d.error || "登录失败";
        btn.disabled = false;
        pwd.select();
      }
    }).catch(function () {
      err.textContent = "网络错误，请重试";
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
